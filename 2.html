<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul>
        <li>apple1</li>
        <li>apple2</li>
        <li>apple3</li>
    </ul>

    <script>
        let ul = document.querySelector("ul");
        let li= document.createElement("li");
        li.textContent="New Content";
        ul.appendChild(li);
    </script>
</body>
</html>
